
name: EXADS Pipeline 1

on:
  pull_request:
    branches: [ master ]

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  make-test-report:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout gh-reports branch
        uses: actions/checkout@v4
        with:
          ref: gh-reports
          path: gh_reports

      - name: Setup CI environment
        uses: ./repo/.github/actions/setup-environment
        with:
          root-dir: repo
          branch_name: ${{env.BRANCH_NAME}}
          secrets_EXADSBOT_TOKEN_ACTIONS: ${{ secrets.EXADSBOT_TOKEN_ACTIONS }}
          secrets_EXADSBOT_ACTIONS_SSH_KEY: ${{ secrets.EXADSBOT_ACTIONS_SSH_KEY }}
          coverage_report_path: gh_reports/coverage/pr_report_clover.xml

      - name: Install dependencies
        run: |
          cd repo
          composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Run test suite and get coverage report
        id: run_tests
        run: |
          cd repo
          composer run-script --timeout=0 test:run:coverage -- --coverage-clover=../gh_reports/coverage/pr_report_clover.xml

      - name: Report phpunit failure
        if: failure() && steps.run_tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd repo && php .github/scripts/report-phpunit-failure.php


#      # Min PR code coverage = 80%
#      - name: Check patch coverage
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#          PR_NUMBER: ${{ github.event.pull_request.number }}
#        run: |
#          cd repo/shared_workflows/.github/scripts/php/code-coverage \
#          && php check-coverage.php \
#          80 \
#          ../gh_reports/coverage/pr_report_clover.xml \
#          ../gh_reports/coverage/master_report_clover.xml \
#          "origin/${{ github.base_ref }}"


      - name: Apply patch coverage gate
        uses: ./repo/.github/actions/phpunit_gate
        with:
          min-patch-coverage: 80    # Min Patch code coverage = 80%
          pr-report-clover: ${{ github.workspace }}/gh_reports/coverage/pr_report_clover.xml
          master-report-clover: ${{ github.workspace }}/gh_reports/coverage/master_report_clover.xml
          pr-repo-location: ${{ github.workspace }}/repo